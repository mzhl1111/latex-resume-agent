[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-resume-agent"
version = "0.2.0"
description = "Tailor a one-page LaTeX resume to a job posting; usable from Claude Code or as an MCP/A2A server"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
server = [
  "mcp>=2.3,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "anyio>=4",
  "anthropic>=0.40",
]
dev = ["pytest>=8", "httpx>=0.27"]

otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
resume-agent = "resume_agent.__main__:main"

[tool.setuptools]
packages = ["resume_agent"]

[tool.setuptools.package-data]
resume_agent = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

services:
  resume-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required when exposed beyond localhost: callers send "Authorization: Bearer <token>"
      RESUME_AGENT_TOKEN: ${RESUME_AGENT_TOKEN:?set RESUME_AGENT_TOKEN in .env}
      # Optional: enables generate_resume (MCP) and A2A generation on the server
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESUME_WRITER_MODEL: ${RESUME_WRITER_MODEL:-claude-sonnet-5-5}
      RESUME_REVIEWER_MODEL: ${RESUME_REVIEWER_MODEL:-claude-sonnet-5-5}
      # URL advertised in the A2A agent card, e.g. https://resume.example.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Tracing: local (default) | otel | none | module:Class, comma-separated to fan out
      RESUME_TRACER: ${RESUME_TRACER:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-latex-resume-agent}
    volumes:
      - ./jobs-server:/data/jobs
      # submitted-application records land here on your machine (one folder each + index.md/csv)
      - ./applications:/data/applications
      # local trace spans (JSONL) read by the dashboard
      - ./traces:/data/traces
      # your private data (gitignored); run `python3 -m resume_agent init` first
      - ./profile:/app/profile:ro
      - ./templates:/app/templates:ro
    restart: unless-stopped

  # Optional: the dashboard over the same traces + applications, on localhost only.
  dashboard:
    build: .
    command: ["python", "-m", "resume_agent", "dashboard", "--host", "0.0.0.0", "--port", "8050"]
    ports:
      - "127.0.0.1:8050:8050"
    volumes:
      - ./applications:/data/applications:ro
      - ./traces:/data/traces:ro
    profiles: ["dashboard"]
